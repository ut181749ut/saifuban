<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIの財布番</title>
<meta name="description" content="AIがお金を使う前に、あなたのスマホに承認を聞きにくる。">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171716" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="財布番">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=BIZ+UDGothic:wght@400;700&family=Yuji+Syuku&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}

/* Layout: ホーム画面に置くアプリ。画面いっぱいの1枚。上に名前と緊急停止、AIごとの残り予算、その下にタブ。承認は朱肉の判子で押す。 */
:root{
  --paper:#f7f6f2; --ink:#1f1f1d; --fade:#55544f; --rule:#cfccc3; --card:#ffffff;
  --shu:#c4372b; --shu-wash:#f6e3df; --hold:#9a6a12;
  --f-dot:"DotGothic16","BIZ UDGothic",ui-monospace,monospace;
  --f-body:"BIZ UDGothic","Hiragino Kaku Gothic ProN","Noto Sans JP",ui-monospace,sans-serif;
  --f-seal:"Yuji Syuku","Hiragino Mincho ProN","Noto Serif JP",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#171716; --ink:#ecebe6; --fade:#a9a79f; --rule:#3b3a36; --card:#201f1d;
  --shu:#e2584a; --shu-wash:#3b2320; --hold:#dcab4c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#171716; --ink:#ecebe6; --fade:#a9a79f; --rule:#3b3a36; --card:#201f1d;
  --shu:#e2584a; --shu-wash:#3b2320; --hold:#dcab4c; color-scheme:dark}
*{box-sizing:border-box}
html{height:100%;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
.wrap{max-width:560px;height:calc(100% + 56px);margin:0 auto;padding-inline:12px;padding-block:12px}
@media (min-width:420px){.wrap{padding-inline:16px}}
.receipt{display:flex;flex-direction:column;gap:12px;height:calc(100% - 56px);min-height:520px;padding-top:6px}
.num{font-variant-numeric:tabular-nums}
hr{border:0;border-top:1px solid var(--rule);margin:0}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--rule);flex:none}
.scroll{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:12px;margin-inline:-4px;padding-inline:4px;padding-bottom:32px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
h1{font-family:var(--f-dot);font-weight:400;font-size:24px;letter-spacing:.08em;margin:0;line-height:1.15}
.status{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fade);flex-wrap:wrap}
.status .dot-i{width:7px;height:7px;background:var(--ink);flex:none}
.status .dot-i.off{background:var(--hold)}
.status button{font-size:12px;padding:0 8px;border-width:1px}
button{font:inherit;color:var(--ink);background:transparent;border:1.5px solid var(--ink);border-radius:0;padding:8px 14px;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--shu);outline-offset:2px}
.primary{background:var(--ink);color:var(--paper)}
.primary:hover{background:var(--paper);color:var(--ink)}
.big{font-size:16px;padding:10px 18px;font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:13px;color:var(--fade);line-height:1.55}
label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--fade);min-width:0}
input{font:inherit;font-size:16px;color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:4px 2px;width:100%;min-width:0}
code,.urlbox{font-family:var(--f-body);font-size:12px;word-break:break-all;white-space:pre-wrap;border:1px solid var(--rule);background:var(--card);padding:8px;display:block;user-select:all}
.hright{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.langbtn{font-size:12px;padding:3px 8px;border:1px solid var(--rule);color:var(--fade)}
.kill{color:var(--shu);border-color:var(--shu);font-weight:700;font-size:14px;padding:7px 12px;flex:none}
.kill:hover,.kill.on{background:var(--shu);color:var(--paper)}
.banner{border:2px solid var(--shu);color:var(--shu);text-align:center;font-weight:700;padding:6px;font-size:14px}
.err{border:1.5px solid var(--hold);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.err b{color:var(--hold)}
/* AIごとの予算(小さなカードを並べる) */
.agents{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.agent{border:1.5px solid var(--ink);background:var(--card);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.ahead{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.agent .name{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.agent .state{font-size:12px;color:var(--fade);flex:none}
.agent .state.off{color:var(--shu);font-weight:700}
.agent .left{font-weight:700;font-size:24px;line-height:1.2}
.agent .left small{font-size:12px;font-weight:400;color:var(--fade);margin-left:6px}
.sub2{font-size:12px;color:var(--fade);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gauge{height:6px;margin-top:2px;background:var(--rule)}
.gauge i{display:block;height:100%;background:var(--ink)}
.gauge i.hot{background:var(--shu)}
/* タブ */
.panel{display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:2px;border-bottom:1.5px solid var(--ink);overflow-x:auto;position:sticky;top:0;z-index:2;background:var(--paper);flex:none}
.tabs button{border:0;padding:6px 10px;white-space:nowrap;color:var(--fade);background:transparent;font-size:15px;flex:none}
.tabs button:hover{background:transparent;color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--paper);background:var(--ink);font-weight:700}
.count{display:inline-block;font-weight:700;color:var(--paper);background:var(--shu);padding:0 5px;margin-left:5px;font-size:12px;line-height:1.5}
.list,.rules{display:flex;flex-direction:column;gap:12px}
/* 承認待ち */
.req{display:grid;grid-template-columns:1fr auto;gap:2px 12px;position:relative}
.req + .req{border-top:1px solid var(--rule);padding-top:12px}
.req b{font-size:17px}
.req .amt{font-weight:700;font-size:24px;text-align:right;line-height:1.15}
.req .meta{grid-column:1/-1;color:var(--fade);font-size:12px}
.req .why{grid-column:1/-1;font-size:15px;background:var(--shu-wash);padding:6px 10px;margin-top:4px}
.req .why::before{content:"理由:";color:var(--fade);margin-right:4px;font-size:13px}
.req .acts{grid-column:1/-1;display:flex;justify-content:flex-end;align-items:center;gap:14px;margin-top:6px}
.req .acts [data-no]{font-size:15px;padding:8px 16px}
.approve{width:64px;height:64px;border-radius:50%;border:3px solid var(--shu);color:var(--shu);background:transparent;font-family:var(--f-seal);font-size:21px;font-weight:700;padding:0;transform:rotate(-8deg);display:grid;place-items:center;line-height:1}
.approve:hover{background:var(--shu-wash);color:var(--shu)}
.stamp{position:absolute;right:4px;bottom:0;width:64px;height:64px;border:3px solid var(--shu);border-radius:50%;color:var(--shu);display:grid;place-items:center;font-family:var(--f-seal);font-size:21px;transform:rotate(-8deg);opacity:.9;animation:stamp .3s ease-out;pointer-events:none}
@keyframes stamp{from{transform:rotate(-8deg) scale(1.7);opacity:0}}
@media (prefers-reduced-motion:reduce){.stamp{animation:none}}
.empty{color:var(--fade);text-align:center;padding:12px 4px;font-size:14px}
/* 履歴 */
.log{display:flex;flex-direction:column}
.log .item{display:grid;grid-template-columns:3.2em 1fr auto;gap:8px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--rule)}
.log .item .m{min-width:0}
.log .item .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .item small{color:var(--fade);font-size:12px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log .item .num{text-align:right;font-weight:700}
.mark{font-size:12px;font-weight:700;text-align:center;border:1.5px solid currentColor;padding:0 2px;line-height:1.5}
.m-ok{color:var(--ink)}
.m-wait{color:var(--hold)}
.m-no{color:var(--shu);text-decoration:line-through}
.m-stop{color:var(--fade)}
.log .item.voided .num{text-decoration:line-through;color:var(--fade)}
/* AIとルール・設定 */
.rule{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.rule + .rule{border-top:1px solid var(--rule);padding-top:12px}
.rule .head{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.rule .full{grid-column:1/-1}
details.more{grid-column:1/-1}
details.more summary{cursor:pointer;color:var(--ink);font-size:14px;padding:4px 0}
details.more .inner{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;padding-top:6px}
details.more .inner .full{grid-column:1/-1}
.danger{color:var(--shu);border-color:var(--shu)}
.danger:hover{background:var(--shu);color:var(--paper)}
/* つなぐ */
.connect{border:2px solid var(--ink);background:var(--card);padding:12px;display:flex;flex-direction:column;gap:12px}
.connect h2{margin:0;font-weight:700;font-size:18px;text-wrap:balance}
.q{display:flex;flex-direction:column;gap:6px}
.q b{font-size:15px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-weight:700;font-size:15px;padding:6px 10px;border:1.5px solid var(--ink)}
.chip:hover{background:transparent;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.nudge{border:1.5px solid var(--ink);background:var(--card);padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:14px}
.nudge .note{font-size:12px}
.nudge button{padding:6px 12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;font-size:14px;max-width:calc(100% - 32px)}
.foot a,.note a{color:inherit}.foot{text-align:center;font-size:12px;color:var(--fade);flex:none;padding-top:8px;border-top:1px solid var(--rule)}
.busy{opacity:.55;pointer-events:none}
#nudge:empty,#connect:empty,#agents:empty{display:none}
@media (max-width:420px){.rule,details.more .inner{grid-template-columns:1fr}}

@media (display-mode: standalone){.wrap{height:100%}.receipt{height:100%}}
.welcome{display:flex;flex-direction:column;gap:16px;padding-block:8px}
.welcome h2{margin:0;font-size:20px;text-wrap:balance}
.welcome p{margin:0}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.keybox{font-family:var(--f-body);font-size:13px;word-break:break-all;border:2px solid var(--ink);background:var(--card);padding:10px;user-select:all}
img.ico{width:56px;height:56px}
.seg{display:flex;flex-wrap:wrap;border:1.5px solid var(--ink);align-self:flex-start}
.segb{border:0;padding:6px 14px;font-size:14px}
.segb[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.guide{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.gstep{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.gstep > div{display:flex;flex-direction:column;gap:6px;min-width:0}
.gnum{width:28px;height:28px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:14px}
.gstep.done .gnum{background:var(--ink);color:var(--paper)}
.gstep.done b{color:var(--fade)}
.howto{align-self:flex-start;border:0;padding:2px 0;margin-top:2px;font-size:13px;text-decoration:underline;text-underline-offset:3px;color:var(--ink)}
.howto:hover{background:transparent;color:var(--shu)}
#langsw{white-space:nowrap}
html[lang="en"] .why::before{content:"Reason: "}
a.btn{display:inline-block;text-decoration:none;border:1.5px solid var(--ink);padding:8px 14px;font-weight:700}
a.btn.primary{background:var(--ink);color:var(--paper)}
</style>
<script src="i18n.js"></script>
</head>
<body>
<div class="wrap">
 <main class="receipt">
  <header>
    <div class="brand"><h1>AIの財布番</h1><div class="status"><span id="dot" class="dot-i off"></span><span id="stat">準備中…</span><span id="clock" class="num"></span><button id="refresh" aria-label="更新" hidden>更新</button></div></div>
    <div class="hright"><button id="langbtn" class="langbtn" lang="en">English</button><button id="kill" class="kill" disabled hidden>緊急停止</button></div>
  </header>
  <div class="scroll" id="scroll">
  <section id="welcome" class="welcome" hidden></section>
  <div id="err" class="err" hidden></div>
  <div id="banner" class="banner" hidden>緊急停止中 — すべての支払いを止めています</div>
  <div id="nudge"></div>
  <div id="connect"></div>
  <div id="agents" class="agents"></div>
  <div class="panel" id="panel" hidden>
    <div class="tabs" role="tablist">
      <button role="tab" data-tab="queue" aria-selected="true">承認待ち<span id="qc" class="count" hidden>0</span></button>
      <button role="tab" data-tab="rules" aria-selected="false">AIとルール</button>
      <button role="tab" data-tab="log" aria-selected="false">履歴</button>
      <button role="tab" data-tab="setup" aria-selected="false">設定</button>
    </div>
    <div id="tab-queue" class="list"><div class="empty">読み込み中…</div></div>
    <div id="tab-log" class="log" hidden></div>
    <div id="tab-rules" class="rules" hidden></div>
    <div id="tab-setup" class="rules" hidden></div>
  </div>
  </div>
  <div class="foot">お金はここでは動きません · 15秒ごとに更新 · <a href="terms.html">規約</a> · <a href="privacy.html">プライバシー</a></div>
 </main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
const PROJECT="zrphnuvrsldcycxtdftv";
const FN="https://"+PROJECT+".supabase.co/functions/v1";
const API=FN+"/saifuban-app";
const KEY_STORE="saifuban.owner";
let guideAI="claude", guideDone={}, guideFor=null;

const LINK=(href,label)=>`<div class="row"><a class="btn primary" href="${href}" target="_blank" rel="noopener" data-step="2">${label}</a></div>`;
const GUIDES=[
 {id:"claude",label:"Claude",steps:(step)=>[
  step(2,"Claudeのコネクタ画面を開く",LINK("https://claude.ai/settings/connectors","Claudeのコネクタ画面を開く")+`<div class="note">スマホのClaudeアプリでは追加できません。アプリが開いてしまうときは、SafariやChromeで claude.ai/settings/connectors を開いてください。有料プランが必要です。</div>`),
  step(3,"「カスタムコネクタを追加」を押して貼る",`<div class="note">名前は「財布番」、URLの欄にコピーしたURLを貼って「追加」。会話の「+」メニューで財布番がオンになっているかも確かめてください。</div>`)]},
 {id:"chatgpt",label:"ChatGPT",steps:(step)=>[
  step(2,"ChatGPTの設定を開く",LINK("https://chatgpt.com/#settings/Connectors","ChatGPTの設定を開く")+`<div class="note">ブラウザで開いてください。「アプリとコネクタ」→「詳細設定」で「開発者モード」をオンにします。有料プランが必要です。</div>`),
  step(3,"「作成」からURLを貼る",`<div class="note">名前は「財布番」、URLの欄にコピーしたURLを貼り、認証は「なし」で作成。会話の「+」メニューから財布番を選んで使います。</div>`)]},
 {id:"muse",label:"Muse",steps:(step,url)=>[
  step(2,"Museのチャットを開く",`<div class="note">スマホのMuseアプリでも大丈夫です。設定画面は使いません。</div>`),
  step(3,"この文をMuseに送る",`<code id="mm" class="urlbox">このMCPサーバーにつないで、ツールを試して、「財布番」というスキルとして保存して。認証はなし。URL: ${url||"(ステップ1のURL)"}</code><div class="row"><button data-copy="mm" data-step="3" class="primary">文をコピー</button></div><div class="note">${url?"":"URLの部分は自分のURLに置き換えてください。"}認証を聞かれたら「なし」と答えます。</div>`)]},
 {id:"other",label:"その他",steps:(step)=>[
  step(2,"AIの設定でコネクタを探す",`<div class="note">「コネクタ」「MCPサーバー」「ツール」「連携」などの名前の設定にあります。URLでつなぐMCP(リモートMCP)に対応したAIで使えます。Cursor・VS Codeなどは設定ファイルのMCPの欄に書きます。</div>`),
  step(3,"URLを貼って保存する",`<div class="note">名前は「財布番」にしておくと分かりやすいです。認証はなしで大丈夫です。</div>`)]},
];
let OWNER=null, D=null, newKey=null, stampId=null, busy=false, wizOpen=false, ownerReveal=null, pushState="checking", swReg=null;
const wiz={daily:1000,auto:300};
const DAILY_OPTS=[100,500,1000,3000,10000], AUTO_OPTS=[0,100,300,1000];

const CURX=()=>D&&D.currency==="USD"?"USD":"JPY";
const RATE=()=>Number(D&&D.usd_jpy)||155;
const money=n=>CURX()==="USD"?"$"+((Number(n)||0)/RATE()).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}):yen(n);
const toD=j=>CURX()==="USD"?+((Number(j)||0)/RATE()).toFixed(2):Math.round(Number(j)||0);
const fromD=v=>CURX()==="USD"?int(Number(v)*RATE()):int(v);
const CL=()=>CURX()==="USD"?"$":"円";
const fmtNote=s=>CURX()==="USD"?String(s||"").replace(/([\d,]+)円/g,(m,n)=>"$"+(Number(n.replace(/,/g,""))/RATE()).toFixed(2)):String(s||"");
let wizCur=null;
const yen=n=>{n=Number(n)||0;return "¥"+(n>0&&n<10&&n%1?n.toFixed(2):Math.round(n).toLocaleString("ja-JP"))};
const hhmm=t=>{const d=new Date(t);return d.toLocaleDateString("ja-JP",{month:"numeric",day:"numeric"})+" "+d.toLocaleTimeString("ja-JP",{hour:"2-digit",minute:"2-digit"})};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const int=n=>Math.max(0,Math.min(100000000,Math.round(Number(n)||0)));
const UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
const splitM=s=>String(s||"").split(/[,、\n]/).map(x=>x.trim()).filter(Boolean);
const $=id=>document.getElementById(id);

function readKey(){try{return localStorage.getItem(KEY_STORE)}catch(_){return null}}
function writeKey(k){try{k?localStorage.setItem(KEY_STORE,k):localStorage.removeItem(KEY_STORE)}catch(_){}}

async function api(action,args={}){
  let r;
  try{
    r=await fetch(API,{method:"POST",headers:{"content-type":"application/json",...(OWNER?{"x-owner-key":OWNER}:{})},body:JSON.stringify({action,...args})});
  }catch(e){return {error:"network"}}
  let j; try{j=await r.json()}catch(_){j={error:"bad_response"}}
  return j;
}

const errText=c=>({not_pending:"この申請はもう判断済みか、失効しています",agent_not_found:"このAIは見つかりません",invalid_owner_key:"合言葉が正しくありません",
  network:"つながりませんでした。電波のよいところでもう一度試してください",bad_key:"APIキーを正しく貼り付けてください",too_many_agents:"AIは20個までつなげます",
  server_error:"サーバーでエラーが起きました。少し待ってもう一度試してください"}[c]||"うまくいきませんでした("+c+")");

function setStatus(ok,text){$("dot").className="dot-i"+(ok?"":" off");$("stat").textContent=text}

async function load(quiet){
  if(!OWNER||busy)return;
  const d=await api("dashboard");
  if(d.error){
    if(d.error==="invalid_owner_key"){setStatus(false,"合言葉が無効です");showWelcome("invalid");return}

const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function b64ToU8(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const p=s.length%4?"=".repeat(4-s.length%4):"";const b=atob(s+p);return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function checkPush(){
  if(!("serviceWorker" in navigator)||!("PushManager" in window)||!("Notification" in window)){
    pushState=isIOS&&!standalone()?"needs-install":"unsupported";render();return}
  try{
    swReg=await navigator.serviceWorker.register("sw.js");
    const sub=await swReg.pushManager.getSubscription();
    pushState=sub?"on":(Notification.permission==="denied"?"denied":"off");
  }catch(_){pushState="unsupported"}
  render();
}
async function enablePush(){
  if(pushState==="needs-install"){setTab("setup");toast("先にホーム画面に追加してください");return}
  try{
    const perm=await Notification.requestPermission();
    if(perm!=="granted"){pushState=perm==="denied"?"denied":"off";render();toast("通知が許可されませんでした");return}
    swReg=swReg||await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const v=await fetch(API+"/vapid").then(r=>r.json());
    const sub=await swReg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64ToU8(v.public_key)});
    const r=await api("push_subscribe",{subscription:sub.toJSON()});
    if(r.error){toast(errText(r.error));return}
    pushState="on";render();
    const t=await api("push_test");
    toast(t.sent?"通知をオンにしました。テスト通知を送りました":"通知をオンにしました");
  }catch(e){toast("通知をオンにできませんでした");pushState="off";render()}
}
async function disablePush(){
  try{const sub=swReg&&await swReg.pushManager.getSubscription();if(sub){await api("push_unsubscribe",{endpoint:sub.endpoint});await sub.unsubscribe()}}catch(_){}
  pushState="off";render();toast("この端末の通知をオフにしました");
}

  if(b.id==="langbtn"){const nl=LANG==="en"?"ja":"en";try{localStorage.setItem("saifuban.lang",nl);localStorage.removeItem("saifuban.lang_synced")}catch(_){}
    if(OWNER)await api("set_lang",{lang:nl});try{if(OWNER)localStorage.setItem("saifuban.lang_synced",nl)}catch(_){}
    const u=new URL(location.href);u.searchParams.delete("lang");location.replace(u.href);return}
  if(b.id==="signup"){b.disabled=true;OWNER=null;const r=await api("signup");b.disabled=false;
    if(r.owner_key){OWNER=r.owner_key;writeKey(OWNER);ownerReveal=r.owner_key;try{localStorage.removeItem("saifuban.lang_synced")}catch(_){}syncLang();showWelcome()}else toast(errText(r.error||"server_error"));return}
  if(b.id==="saved"){ownerReveal=null;return showApp()}
  if(b.id==="restore"){const k=val("in-key").trim();if(!/^sbo_[0-9a-f]{48}$/.test(k)){toast("合言葉の形が違います(sbo_ で始まる52文字)");return}
    OWNER=k;const d=await api("dashboard");if(d.error){OWNER=null;toast(errText(d.error));return}
    writeKey(k);showApp();toast("この端末で使えるようになりました");return}
  if(!OWNER)return;
  if(b.id==="refresh"||b.id==="retry"){$("err").hidden=true;return load()}
  if(b.id==="logout"){if(delArm!=="logout"){delArm="logout";b.textContent="合言葉を保存したら、もう一度押す";return}
    delArm=null;await disablePush();writeKey(null);OWNER=null;D=null;showWelcome();return}
  if(b.dataset.ok){const id=int(b.dataset.ok);const r=await run("decide",{id,approve:true},"承認しました。AIに支払いOKが伝わります");if(r&&r.ok){stampId=id;render();setTimeout(()=>{stampId=null;render()},1200)}return}
  if(b.dataset.no)return run("decide",{id:int(b.dataset.no),approve:false},"却下しました");
  if(b.id==="kill"&&D)return run("set_kill",{kill:!D.kill},D.kill?"停止を解除しました":"全AIを停止しました");
  if(b.dataset.toggle||b.dataset.save){
    const id=b.dataset.toggle||b.dataset.save;if(!UUID.test(id))return;const a=D.agents.find(x=>x.id===id);if(!a)return;
    const card=b.closest(".rule"),g=f=>card.querySelector(`[data-f="${f}"]`).value;
    const active=b.dataset.toggle?!a.active:a.active;
    return run("update_agent",{id,name:a.name,per_tx:fromD(g("per_tx")),daily:fromD(g("daily")),auto:fromD(g("auto")),merchants:splitM(g("merchants")),active},
      b.dataset.toggle?(active?`${a.name}を再開しました`:`${a.name}を止めました`):`${a.name}のルールを保存しました`);
  }
  if(b.dataset.del){const id=b.dataset.del;if(!UUID.test(id))return;
    if(delArm!==id){delArm=id;$("cf-"+id).hidden=false;return}
    delArm=null;return run("delete_agent",{id},"削除しました");}
  if(b.dataset.chip){const[k,v]=b.dataset.chip.split(":");if(k in wiz){wiz[k]=int(v);renderTop()}return}
  if(b.id==="wiz-open"){wizOpen=true;renderTop();$("scroll").scrollTo({top:0,behavior:"smooth"});return}
  if(b.id==="wiz-close"){wizOpen=false;return renderTop()}
  if(b.id==="add"){
    const name=(val("n-name").trim()||("AI "+(D.agents.length+1))).slice(0,60);
    const r=await run("create_agent",{name,per_tx:fromD(wiz.daily),daily:fromD(wiz.daily),auto:fromD(Math.min(wiz.auto,wiz.daily)),merchants:[]},"つなぐURLができました");
    if(r&&r.agent_key){guideDone={};guideFor=null;newKey={name,key:r.agent_key};wizOpen=false;renderTop();$("scroll").scrollTo({top:0,behavior:"smooth"})}return}
  if(b.dataset.hidekey){newKey=null;guideFor=null;return renderTop()}
  if(b.dataset.howto){if(!UUID.test(b.dataset.howto))return;newKey=null;guideFor=b.dataset.howto;guideDone={};wizOpen=false;renderTop();$("scroll").scrollTo({top:0,behavior:"smooth"});return}
  if(b.dataset.rotate){const id=b.dataset.rotate;if(!UUID.test(id))return;const a=D.agents.find(x=>x.id===id);if(!a)return;
    if(delArm!=="rot-"+id){delArm="rot-"+id;b.textContent="もう一度押すと今のURLは使えなくなります";return}
    delArm=null;const r=await run("rotate_key",{id},"新しい接続URLを発行しました");
    if(r&&r.agent_key){guideDone={};guideFor=null;newKey={name:a.name,key:r.agent_key};renderTop();$("scroll").scrollTo({top:0,behavior:"smooth"})}return}
  if(b.dataset.cur){const c=b.dataset.cur==="USD"?"USD":"JPY";if(c===CURX())return;return run("set_currency",{currency:c},c==="USD"?"ドル表示にしました":"円表示にしました")}
  if(b.id==="push-on")return enablePush();
  if(b.id==="push-off")return disablePush();
  if(b.id==="push-test"){const t=await api("push_test");toast(t.sent?"テスト通知を送りました":"送れませんでした。通知をオンにし直してください");return}
  if(b.dataset.pkey){const p=b.dataset.pkey;if(!PROV[p])return;const inp=$("pk-"+p),k=inp.value.trim();
    if(k.length<20||/\s/.test(k)){toast("APIキーを正しく貼り付けてください");return}
    const r=await run("set_provider_key",{provider:p,key:k},`${PROV[p].label}のキーを預かりました`);
    if(r&&r.ok)inp.value="";return}
  if(b.dataset.pkeyoff){const p=b.dataset.pkeyoff;if(!PROV[p])return;
    if(delArm!=="pk-"+p){delArm="pk-"+p;b.textContent="もう一度押すとやめます";return}
    delArm=null;return run("set_provider_key",{provider:p,key:""},`${PROV[p].label}のキーを外しました`)}
});

const LANG=window.SAIFUBAN_LANG||"ja";
{const l=$("langbtn");if(LANG==="en"){l.textContent="日本語";l.lang="ja"}}
async function syncLang(){try{if(OWNER&&localStorage.getItem("saifuban.lang_synced")!==LANG){const r=await api("set_lang",{lang:LANG});if(r&&r.ok)localStorage.setItem("saifuban.lang_synced",LANG)}}catch(_){}}
OWNER=readKey();
if(OWNER){showApp()}else{setStatus(false,"");showWelcome()}
checkPush();
setInterval(()=>{if(OWNER&&document.visibilityState==="visible")load(true)},15000);
document.addEventListener("visibilitychange",()=>{if(OWNER&&document.visibilityState==="visible")load(true)});
</script>
</body>
