name: keepalive
# 無料プランのSupabaseが使われない期間に自動で一時停止しないよう、週2回だけ軽くアクセスする
on:
  schedule:
    - cron: "17 3 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Saifuban (touches the database, writes nothing)
        run: |
          curl -fsS -m 30 -X POST https://zrphnuvrsldcycxtdftv.supabase.co/functions/v1/saifuban-app \
            -H "content-type: application/json" \
            -d '{"action":"track","event":"keepalive"}' || true
          curl -fsS -m 30 https://zrphnuvrsldcycxtdftv.supabase.co/functions/v1/saifuban-app/vapid > /dev/null
